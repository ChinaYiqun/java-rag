name: Java-RAG CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Reject hard-coded credentials
        run: bash scripts/check-no-hardcoded-secrets.sh

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run no-API-key RAG demo
        run: bash scripts/run-no-api-demo.sh

      - name: Build React playground
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start the full playground stack
        run: docker compose up --build --detach

      - name: Wait for browser and API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/playground-health.json; then
              cat /tmp/playground-health.json
              exit 0
            fi
            sleep 2
          done
          echo 'Playground did not become ready.' >&2
          docker compose logs --no-color
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance test and capture screenshot
        working-directory: frontend
        run: npm run e2e

      - name: Commit accepted screenshot to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/playground.png
          if git diff --cached --quiet; then
            echo 'Accepted screenshot is already current.'
            exit 0
          fi
          git commit -m 'docs: capture accepted playground UI [skip ci]'
          git push origin HEAD:"${HEAD_REF}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            docs/assets/playground.png
            frontend/playwright-report
            frontend/test-results

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop playground stack
        if: always()
        run: docker compose down --volumes --remove-orphans
