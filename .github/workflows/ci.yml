name: Java-RAG CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Reject hard-coded credentials
        run: bash scripts/check-no-hardcoded-secrets.sh

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run no-API-key RAG demo
        run: bash scripts/run-no-api-demo.sh

      - name: Build React playground
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start the full playground stack
        run: docker compose up --build --detach

      - name: Wait for browser and API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/playground-health.json; then
              cat /tmp/playground-health.json
              exit 0
            fi
            sleep 2
          done
          echo 'Playground did not become ready.' >&2
          docker compose logs --no-color
          exit 1

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance test and capture screenshot
        working-directory: frontend
        run: npm run e2e

      - name: Commit accepted screenshot and README showcase to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          updates = [
              (
                  Path('README.md'),
                  '## Why Java-RAG?',
                  '''<!-- playground-screenshot -->
          ## Visual Playground

          ![Java-RAG visual playground with knowledge base, grounded chat, and retrieval evidence](docs/assets/playground.png)

          This screenshot is generated by the Playwright acceptance test after Docker Compose starts the real application, the browser loads the sample document, asks a grounded question, and verifies the matching retrieval evidence.''',
              ),
              (
                  Path('README_ch.md'),
                  '## 为什么值得关注？',
                  '''<!-- playground-screenshot -->
          ## 可视化 Playground

          ![Java-RAG 可视化知识库、证据化问答与检索证据界面](docs/assets/playground.png)

          这张截图由 Playwright 验收测试自动生成：Docker Compose 启动真实应用后，浏览器加载示例文档、完成一次证据化问答，并校验右侧检索证据与回答引用一致。''',
              ),
          ]

          for path, anchor, block in updates:
              text = path.read_text(encoding='utf-8')
              if '<!-- playground-screenshot -->' in text:
                  continue
              if anchor not in text:
                  raise SystemExit('README anchor not found in %s' % path)
              path.write_text(text.replace(anchor, block + '\n\n' + anchor, 1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/playground.png README.md README_ch.md
          if git diff --cached --quiet; then
            echo 'Accepted screenshot and README showcase are already current.'
            exit 0
          fi
          git commit -m 'docs: publish accepted playground screenshot [skip ci]'
          git push origin HEAD:"${HEAD_REF}"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playground-browser-evidence
          if-no-files-found: ignore
          retention-days: 30
          path: |
            docs/assets/playground.png
            frontend/playwright-report
            frontend/test-results

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop playground stack
        if: always()
        run: docker compose down --volumes --remove-orphans
