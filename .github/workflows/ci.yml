name: Java-RAG CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Reject hard-coded credentials
        run: bash scripts/check-no-hardcoded-secrets.sh

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run no-API-key RAG demo
        run: bash scripts/run-no-api-demo.sh
